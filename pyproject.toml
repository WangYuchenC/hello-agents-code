[project]
name = "hello-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "google-search-results>=2.4.2",
    "openai>=2.36.0",
    "requests>=2.33.1",
    "tavily-python>=0.7.24",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hello_agents"
module-root = "src"